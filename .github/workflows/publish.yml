name: Build and publish to Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: |
          npm install
          npx expo install --fix

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build the iOS bundle (proves the app compiles)
        run: npx expo export --platform ios --output-dir dist

      - name: Set up EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link the Expo project (first run only)
        if: env.EXPO_TOKEN != ''
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
          fi
          if ! grep -q 'u.expo.dev' app.json; then
            eas update:configure --platform ios --non-interactive || true
          fi

      - name: Save project link and package versions
        if: env.EXPO_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Link Expo project and lock package versions [skip ci]"
            git push
          fi

      - name: Publish update to Expo Go
        if: env.EXPO_TOKEN != ''
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: eas update --branch main --platform ios --message "$MESSAGE" --non-interactive
